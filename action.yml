name: PR Guard
description: Buys independent security checks from Telegraph miners on every pull request and posts a SAFE / CAUTION / BLOCK verdict with receipts.
branding:
  icon: shield
  color: green
inputs:
  telegraph-private-key:
    description: Burner key holding Telegraph test USDC on Ethereum Sepolia (store as a secret). Never a key with real funds. Leave it out to use free hosted scans (public repositories only).
    required: false
  service-url:
    description: Hosted PR Guard service used when no key is set. It pays for the checks from a sponsor wallet.
    default: https://pr-guard-app.pr-guard.workers.dev
  max-usd-per-pr:
    description: Hard cap on total spend for one PR run, in USD. Hosted scans are capped at $0.10 by the service.
    default: "0.10"
  max-usd-per-call:
    description: Hard cap on a single paid call, in USD. Quotes above it are refused before signing.
    default: "0.05"
  fail-on:
    description: Fail the job on `block`, `caution` (CAUTION or BLOCK), or `never`.
    default: block
  checks:
    description: Comma-separated paid checks to run. `deps` and `diff` have vetted miners on Telegraph's current network; `patch` and `urls` are skipped until theirs are. Secret and install-script checks always run locally.
    default: deps,diff
  node-url:
    description: Telegraph node URL.
    default: https://devnode.telegraphprotocol.com
  miners-config:
    description: Optional path to a miners allowlist JSON overriding the bundled one.
    required: false
  github-token:
    description: Token used to read the PR and post the comment.
    default: ${{ github.token }}
outputs:
  verdict:
    description: SAFE, CAUTION, BLOCK or SKIPPED.
  cost_usd:
    description: Total spent on this run, in USD.
  signal_hashes:
    description: Comma-separated Telegraph signal hashes for every paid call.
  ledger_path:
    description: Path of the JSONL purchase ledger written by this run.
runs:
  using: node24
  main: dist/index.js
