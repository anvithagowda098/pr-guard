# Copy to .github/workflows/pr-guard.yml in the repository you want guarded.
# PR Guard pays for each check itself from your burner wallet: works for
# private repositories, with your own budget and a purchase ledger per run.
# Needs a TELEGRAPH_PRIVATE_KEY secret holding only Telegraph test USDC.
name: PR Guard
on:
  pull_request: # opened, synchronize, reopened: each run is a paid scan

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: guard
        uses: anvithagowda098/pr-guard@main
        with:
          telegraph-private-key: ${{ secrets.TELEGRAPH_PRIVATE_KEY }}
          max-usd-per-pr: "0.10"
          fail-on: block
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-guard-ledger
          path: pr-guard-ledger.jsonl
          if-no-files-found: ignore
