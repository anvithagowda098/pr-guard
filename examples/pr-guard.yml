# Copy to .github/workflows/pr-guard.yml in a public repository.
# No secrets needed: without a key, the checks are paid by PR Guard's hosted
# service from its sponsor wallet (test USDC). Private repositories are skipped;
# use pr-guard-wallet.yml for those.
name: PR Guard
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: anvithagowda098/pr-guard@main
        with:
          fail-on: block # or `caution`, or `never` to only comment
