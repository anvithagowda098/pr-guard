# PR Guard Sentinel: Telegraph miner YAML (public; pinned and hashed at registration).
# Before registering, replace base_url with the deployed Worker URL, then
# validate: POST https://integrate.telegraphprotocol.com/api/validate
version: "1"
kind: miner
id: 731001
slug: pr-guard-sentinel
protocol: generic
name: PR Guard Sentinel (code and dependency security review)
description: >
  Deterministic security review for code, diffs and package versions. /review
  scans code or a unified diff with rule families for SQL and OS command
  injection, eval, unsafe deserialization, disabled TLS verification, path
  traversal, SSRF, XSS, weak hashes, debug mode and hardcoded secrets, and
  reports each finding with line, CWE, severity and fix. Any package@version
  named in the request is checked against OSV. /package returns the known
  vulnerabilities of one package version (npm, PyPI, Go, crates.io, Maven,
  RubyGems, NuGet, Packagist) with severity, CVSS and fixed versions. No model
  in the loop: the same input always gets the same answer.

base_url: https://pr-guard-sentinel.REPLACE-WITH-SUBDOMAIN.workers.dev

auth:
  type: none

rate_limit_per_sec: 20
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 30

limitations:
  - code: MAX_BODY_SIZE
    message: Request body must be 200,000 bytes or fewer.
    property: size_bytes
    value_bytes: 200000
    operator: lte

errors:
  message_path: error

endpoints:
  - path: /review
    external_path: /review
    method: POST
    description: >
      Security review of source code, a unified diff or a pull request change,
      or a question that contains code and/or package@version names. Returns a
      verdict (secure, vulnerable, needs review), each finding with line, CWE,
      severity and fix, and OSV results for any packages named. Put the whole
      question with its code in `query`, or the raw code in `code`, or a
      unified diff in `diff`.
    intents: [SECURITY_REVIEW]
    params:
      body:
        optional:
          - name: query
            type: string
            intents: ["*"]
            description: The full question, verbatim, including the code, diff or package@version names to review.
            example: "Review this for security issues: exec('ping -c 1 ' + req.query.host)"
          - name: code
            type: string
            intents: ["*"]
            description: Source code to review, any language.
          - name: diff
            type: string
            intents: ["*"]
            description: A unified diff; only added lines are reviewed.

  - path: /package
    external_path: /package
    method: POST
    description: >
      Known vulnerabilities in one dependency version (for example lodash
      4.17.15 on npm or django 3.2.0 on PyPI), with severity, CVSS score,
      advisory and CVE ids and the versions that fix them. Use for questions
      about whether a specific package version is safe to use.
    intents: [SECURITY_REVIEW]
    params:
      body:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: Package name as published, for example lodash or @babel/core.
            example: lodash
          - name: version
            type: string
            intents: ["*"]
            description: Exact package version.
            example: 4.17.15
        optional:
          - name: ecosystem
            type: string
            intents: ["*"]
            description: Package registry. Defaults to npm.
            default: npm
            accepted_fields:
              - { value: npm, intents: ["*"], description: npm (JavaScript) }
              - { value: PyPI, intents: ["*"], description: PyPI (Python) }
              - { value: Go, intents: ["*"], description: Go modules }
              - { value: crates.io, intents: ["*"], description: crates.io (Rust) }
              - { value: Maven, intents: ["*"], description: Maven (Java) }
              - { value: RubyGems, intents: ["*"], description: RubyGems }
              - { value: NuGet, intents: ["*"], description: NuGet (.NET) }
              - { value: Packagist, intents: ["*"], description: Packagist (PHP) }

  - path: /health
    external_path: /health
    method: GET
    description: Liveness check; returns the miner name, version and rule count.

input_schema:
  type: object
  properties:
    query: { type: string, description: Question with code, diff or package@version names. }
    code: { type: string }
    diff: { type: string }
    name: { type: string }
    version: { type: string }
    ecosystem: { type: string }

output_schema:
  type: object
  properties:
    answer: { type: string, description: "One plain-language answer, starting 'Verdict: secure|vulnerable|needs review.'" }
    verdict: { type: string, enum: [secure, vulnerable, needs review] }
    severity: { type: string, enum: [none, unrated, low, medium, high, critical] }
    confidence: { type: number, minimum: 0, maximum: 1 }
    reason: { type: string, description: How the answer was reached. }
    findings:
      type: array
      items:
        type: object
        properties:
          rule: { type: string }
          title: { type: string }
          severity: { type: string }
          cwe: { type: string }
          line: { type: integer }
          evidence: { type: string, description: The offending line, with any secret redacted. }
          fix: { type: string }
    packages:
      type: array
      items:
        type: object
        properties:
          ecosystem: { type: string }
          name: { type: string }
          version: { type: string }
          severity: { type: string }
          vulnerabilities: { type: array, items: { type: object } }

semantics:
  signal_mapping:
    label_field: answer
    confidence_field: confidence
    reason_field: reason
  supported_intents:
    - SECURITY_REVIEW
